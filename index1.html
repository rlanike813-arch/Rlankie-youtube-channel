<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RLanike - YouTube Channel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 500px;
        }
        h1 {
            color: #ff0000;
            font-size: 48px;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            color: #333;
            margin: 20px 0;
        }
        .qr-code {
            width: 250px;
            height: 250px;
            margin: 30px 0;
            border: 3px solid #ff0000;
            border-radius: 10px;
        }
        a {
            display: inline-block;
            background-color: #ff0000;
            color: white;
            padding: 15px 40px;
            text-decoration: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            transition: background-color 0.3s;
        }
        a:hover {
            background-color: #cc0000;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 RLanike</h1>
        <p>Welcome to my YouTube Channel!</p>
        <p>Scan the QR code or click below to visit my channel</p>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://www.youtube.com/@RLanike" alt="QR Code" class="qr-code">
        <a href="https://www.youtube.com/@RLanike" target="_blank">Visit Channel</a>
    </div>
</body>
</html>
