<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RLanike - YouTube Channel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 700px;
            width: 90%;
        }
        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        h1 {
            font-size: 72px;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        .tagline {
            font-size: 20px;
            font-weight: 300;
        }
        .content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            align-items: center;
        }
        .qr-section {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }
        .qr-code {
            width: 100%;
            height: auto;
        }
        .info-section {
            color: white;
        }
        .info-section h2 {
            font-size: 32px;
            margin-bottom: 20px;
        }
        .info-section p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        a {
            display: inline-block;
            background-color: white;
            color: #667eea;
            padding: 15px 40px;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            font-size: 18px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        a:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        @media (max-width: 600px) {
            .content {
                grid-template-columns: 1fr;
            }
            h1 {
                font-size: 48px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>RLanike</h1>
            <div class="tagline">YouTube Channel</div>
        </div>
        <div class="content">
            <div class="qr-section">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://www.youtube.com/@RLanike" alt="QR Code" class="qr-code">
            </div>
            <div class="info-section">
                <h2>Scan Now</h2>
                <p>Use your phone to scan the QR code or click the button below to visit my YouTube channel</p>
                <a href="https://www.youtube.com/@RLanike" target="_blank">Visit Channel</a>
            </div>
        </div>
    </div>
</body>
</html>
